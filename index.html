<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalkulator IPAL SPPG</title>
  <meta name="description" content="Kalkulator kapasitas IPAL SPPG teknologi MBBR sesuai Kepmen LHK No. 2760 Tahun 2025. DLH Kabupaten Cilacap.">
  <meta name="theme-color" content="#0b7480">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IPAL SPPG">
  <style>
    html, body { margin: 0; height: 100%; background: #f2f6f6; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .muat { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; font: 15px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #566e76; text-align: center; padding: 24px; }
    .muat img { width: 72px; height: 72px; }
    .muat b { color: #10262d; }
  </style>
</head>
<body>
  <div class="muat" id="muat">
    <img src="icon-192.png" alt="">
    <div><b>Kalkulator IPAL SPPG</b><br><span id="muat-teks">Memuat aplikasi…</span></div>
  </div>

  <!-- ===== GANTI alamat di bawah dengan URL web app Apps Script (yang berakhiran /exec) ===== -->
  <iframe id="app" src="URL_WEB_APP_APPS_SCRIPT" title="Kalkulator IPAL SPPG" allow="fullscreen" allowfullscreen></iframe>

  <script>
    if (!navigator.onLine) {
      document.getElementById('muat-teks').textContent = 'Tidak ada koneksi internet. Sambungkan internet lalu buka lagi aplikasinya.';
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
